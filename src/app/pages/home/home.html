<!-- 3D Background -->
<div #canvasContainer class="fixed inset-0 z-0 pointer-events-none"></div>

<!-- Stock Ticker -->
<app-stock-ticker></app-stock-ticker>

<!-- Navigation -->
<app-navbar (openAuth)="openAuth($event)"></app-navbar>

<!-- Hero Section -->
<main class="relative z-10 min-h-screen flex items-center justify-center px-6 pt-32">
  <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-12 items-center">

    <!-- Left Content -->
    <div class="space-y-8">
      <div class="inline-flex items-center gap-2 glass-panel px-4 py-2 rounded-full">
        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
        <span class="text-xs font-medium text-gray-300">Live Market Data</span>
      </div>

      <h1 class="hero-title text-5xl md:text-7xl font-bold leading-tight">
        Trade Smarter with <span class="gradient-text">AI-Powered</span> Insights
      </h1>

      <p class="text-lg text-gray-400 max-w-lg leading-relaxed">
        Experience the future of trading with real-time analytics, predictive modeling, and institutional-grade tools.
      </p>

      <div class="flex flex-wrap gap-4">
        <button (click)="openAuth('register')" class="glow-button bg-gradient-to-r from-green-500 to-cyan-500 text-black font-bold px-8 py-4 rounded-full text-lg hover:shadow-2xl transition-all transform hover:scale-105">
          Start Trading Now
        </button>
        <button class="glass-panel px-8 py-4 rounded-full text-lg font-medium hover:bg-white/5 transition-all">
          Watch Demo
        </button>
      </div>

      <div class="flex items-center gap-6 pt-4">
        <div class="flex -space-x-3">
          <img src="https://i.pravatar.cc/150?img=1" class="w-10 h-10 rounded-full border-2 border-black">
          <img src="https://i.pravatar.cc/150?img=2" class="w-10 h-10 rounded-full border-2 border-black">
          <img src="https://i.pravatar.cc/150?img=3" class="w-10 h-10 rounded-full border-2 border-black">
          <img src="https://i.pravatar.cc/150?img=4" class="w-10 h-10 rounded-full border-2 border-black">
        </div>
        <div>
          <div class="text-2xl font-bold gradient-text">50K+</div>
          <div class="text-sm text-gray-400">Active Traders</div>
        </div>
      </div>
    </div>

    <!-- Right Content - Dashboard Preview -->
    <div class="dashboard-card relative floating-card">
      <!-- Hna t7t l-mock dashboard li 3tieth lik lfo9 -->
      <div class="absolute -inset-1 bg-gradient-to-r from-green-500 to-cyan-500 rounded-2xl blur opacity-30"></div>
      <div class="relative glass-panel rounded-2xl p-6 border border-white/10">
        <!-- ... (nafss l-content dyal l-mock dashboard) ... -->
      </div>
    </div>
  </div>
</main>

<!-- Features -->
<app-features></app-features>

<!-- Auth Modal -->
<app-auth-modal
  *ngIf="showAuthModal"
  [mode]="authMode"
  (close)="closeAuth()">
</app-auth-modal>
