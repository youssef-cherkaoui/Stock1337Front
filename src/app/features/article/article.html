<div class="articles-container">
  <!-- Navbar -->
  <nav class="glass-nav px-8 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button routerLink="/dashboard" class="text-gray-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
      </button>
      <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">
        Articles
      </h1>
    </div>
    <button *ngIf="isAdmin" (click)="showAddForm = !showAddForm"
            class="glow-button px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-bold">
      + Nouvel Article
    </button>
  </nav>

  <div class="p-8 max-w-[1920px] mx-auto">
    <!-- Filters -->
    <div class="glass-card p-6 rounded-3xl mb-8 flex flex-wrap gap-4">
      <div class="relative flex-1 min-w-[200px]">
        <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <select (change)="onStockFilter($event)" class="w-full bg-black/30 border border-white/10 rounded-2xl pl-12 pr-4 py-4 text-white focus:border-emerald-500/50 focus:outline-none appearance-none cursor-pointer">
          <option value="">Tous les Stocks</option>
          <option *ngFor="let stock of stocks" [value]="stock.id">{{ stock.name }}</option>
        </select>
      </div>
      <div class="relative flex-1 min-w-[200px]">
        <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
        </svg>
        <select (change)="onDeptFilter($event)" class="w-full bg-black/30 border border-white/10 rounded-2xl pl-12 pr-4 py-4 text-white focus:border-emerald-500/50 focus:outline-none appearance-none cursor-pointer">
          <option value="">Tous les Départements</option>
          <option *ngFor="let dept of departements" [value]="dept.id">{{ dept.name }}</option>
        </select>
      </div>
    </div>

    <!-- Add Article Form -->
    <div *ngIf="showAddForm && isAdmin" class="glass-card p-8 rounded-3xl mb-8 border border-emerald-500/30 bg-emerald-500/5">
      <h3 class="text-2xl font-bold mb-6 text-emerald-400">Nouvel Article</h3>
      <form [formGroup]="articleForm" (ngSubmit)="addArticle()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <input formControlName="name" placeholder="Nom de l'article"
               class="bg-black/30 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 focus:border-emerald-500/50 focus:outline-none">
        <input formControlName="description" placeholder="Description"
               class="bg-black/30 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 focus:border-emerald-500/50 focus:outline-none">
        <input type="number" formControlName="quantity" placeholder="Quantité"
               class="bg-black/30 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 focus:border-emerald-500/50 focus:outline-none">
        <input type="number" formControlName="minThreshold" placeholder="Seuil minimum"
               class="bg-black/30 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 focus:border-emerald-500/50 focus:outline-none">
        <select formControlName="stockId"
                class="bg-black/30 border border-white/10 rounded-xl px-4 py-4 text-white focus:border-emerald-500/50 focus:outline-none appearance-none">
          <option value="">Sélectionner Stock</option>
          <option *ngFor="let stock of stocks" [value]="stock.id">{{ stock.name }}</option>
        </select>
        <select formControlName="departementId"
                class="bg-black/30 border border-white/10 rounded-xl px-4 py-4 text-white focus:border-emerald-500/50 focus:outline-none appearance-none">
          <option value="">Sélectionner Département</option>
          <option *ngFor="let dept of departements" [value]="dept.id">{{ dept.name }}</option>
        </select>
        <div class="md:col-span-2 lg:col-span-3 flex gap-4">
          <button type="submit" [disabled]="articleForm.invalid"
                  class="flex-1 bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-emerald-500/25 transition-all disabled:opacity-50">
            Ajouter Article
          </button>
          <button type="button" (click)="showAddForm = false"
                  class="px-8 py-4 rounded-xl border border-white/20 text-white hover:bg-white/10 transition-colors">
            Annuler
          </button>
        </div>
      </form>
    </div>

    <!-- Articles Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div *ngFor="let article of articles"
           class="glass-card group relative overflow-hidden rounded-3xl p-6 border border-white/5 hover:border-white/20 transition-all duration-500"
           [class.border-rose-500/50]="article.quantity <= article.minThreshold"
      [class.bg-rose-500/5]="article.quantity <= article.minThreshold">

      <!-- Alert Badge -->
      <div *ngIf="article.quantity <= article.minThreshold"
           class="absolute top-4 right-4 px-3 py-1 bg-rose-500/20 border border-rose-500/30 rounded-full text-rose-400 text-xs font-bold uppercase tracking-wider">
        Stock Faible
      </div>

      <div class="flex items-start justify-between mb-4">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl"
             [class]="article.quantity <= article.minThreshold ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'">
          📦
        </div>
        <span class="text-3xl font-black"
              [class]="article.quantity <= article.minThreshold ? 'text-rose-400' : 'text-emerald-400'">
            {{ article.quantity }}
          </span>
      </div>

      <h3 class="text-xl font-bold mb-2 group-hover:text-emerald-400 transition-colors">{{ article.name }}</h3>
      <p class="text-gray-400 text-sm mb-4 line-clamp-2">{{ article.description }}</p>

      <div class="space-y-2 mb-4">
        <div class="flex items-center gap-2 text-sm text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
          {{ article.stock?.name }}
        </div>
        <div class="flex items-center gap-2 text-sm text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
          </svg>
          {{ article.departement?.name }}
        </div>
      </div>

      <div class="flex items-center justify-between pt-4 border-t border-white/10">
        <span class="text-xs text-gray-500">Min: {{ article.minThreshold }}</span>
        <button *ngIf="!isAdmin" (click)="demandeArticle(article)"
                class="px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-400 text-sm font-bold hover:bg-emerald-500/30 transition-colors">
          Demander
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="articles.length === 0" class="text-center py-20">
    <div class="text-6xl mb-4">📭</div>
    <h3 class="text-2xl font-bold text-gray-400">Aucun article trouvé</h3>
  </div>
</div>
</div>
