<div class="stocks-wrapper">
  <canvas #threeCanvas class="three-canvas"></canvas>

  <!-- Navbar -->
  <nav class="glass-nav">
    <div class="nav-content">
      <div class="nav-left">
        <button (click)="goToDashboard()" class="back-btn" title="Retour au Dashboard">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
        </button>
        <h1 class="nav-title">📦 Gestion des Stocks</h1>
      </div>
      <button *ngIf="isAdmin" (click)="showAddForm = !showAddForm" class="glow-button">
        <span *ngIf="!showAddForm">+ Nouveau Stock</span>
        <span *ngIf="showAddForm">✕ Fermer</span>
      </button>
    </div>
  </nav>

  <div class="main-content">
    <!-- Add/Edit Stock Form -->
    <div *ngIf="showAddForm && isAdmin" class="form-card">
      <h3 class="form-title">
        {{ editingStock ? '✏️ Modifier Stock' : '➕ Nouveau Stock' }}
      </h3>
      <form [formGroup]="stockForm" (ngSubmit)="createStock()" class="form-grid">
        <div class="form-field">
          <label>Nom du stock *</label>
          <input formControlName="name" placeholder="Ex: Stock Principal">
        </div>
        <div class="form-field">
          <label>Localisation *</label>
          <input formControlName="localisation" placeholder="Ex: Bâtiment A">
        </div>
        <div class="form-field">
          <label>Département *</label>
          <div class="select-wrap">
            <select formControlName="departementId">
              <option value="">Sélectionner</option>
              <option *ngFor="let dept of departements" [value]="dept.id">{{ dept.name }}</option>
            </select>
            <svg class="select-arrow" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" [disabled]="stockForm.invalid" class="btn-submit">
            {{ editingStock ? 'Mettre à jour' : 'Créer Stock' }}
          </button>
          <button type="button" (click)="cancelEdit()" class="btn-cancel">
            Annuler
          </button>
        </div>
      </form>
    </div>

    <!-- Stocks Grid -->
    <div class="stocks-grid" *ngIf="stocks.length > 0">
      <div *ngFor="let stock of stocks; let i = index" class="stock-card" [style.animation-delay]="i * 0.1 + 's'">
        <div class="card-glow"></div>

        <!-- MODIFIÉ: Seulement l'icône, sans le count -->
        <div class="card-header">
          <div class="stock-icon">📦</div>
        </div>

        <h3 class="stock-name">{{ stock.name }}</h3>

        <div class="stock-location">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span>{{ stock.localisation }}</span>
        </div>

        <div class="stock-dept">
          <span class="dept-badge">{{ stock.departement?.name || 'N/A' }}</span>
        </div>

        <div class="card-actions">
          <button routerLink="/articles" [queryParams]="{ stockId: stock.id }" class="btn-view">
            Voir Articles
          </button>
          <ng-container *ngIf="isAdmin">
            <button (click)="editStock(stock)" class="btn-edit" title="Modifier">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
            </button>
            <button (click)="deleteStock(stock.id)" class="btn-delete" title="Supprimer">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </ng-container>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="stocks.length === 0" class="empty-state">
      <div class="empty-icon">🏭</div>
      <h3>Aucun stock trouvé</h3>
      <p *ngIf="isAdmin">Créez votre premier stock pour commencer</p>
      <button *ngIf="isAdmin" (click)="showAddForm = true" class="btn-add-first">
        + Créer un stock
      </button>
    </div>
  </div>
</div>
